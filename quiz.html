<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Beyond the Imagination</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      min-height: 100vh;
      padding-bottom: 30px;
    }

    .header {
      background: #ffffff;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .header h1 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    .header p {
      color: #6b7280;
      font-size: 14px;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .quiz-card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .progress {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .question {
      font-size: 21px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 15px;
      margin-bottom: 12px;
      border: 2px solid #e5e7eb;
      background: white;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      color: #1f2937;
      transition: 0.2s;
    }

    .option:hover:not(:disabled) {
      border-color: #6366f1;
      background: #f8f8ff;
      transform: translateY(-1px);
    }

    .option:disabled {
      cursor: default;
    }

    .option.correct {
      border-color: #16a34a;
      background: #dcfce7;
      color: #166534;
    }

    .option.wrong {
      border-color: #dc2626;
      background: #fee2e2;
      color: #991b1b;
    }

    .feedback {
      display: none;
      margin-top: 15px;
      padding: 13px 15px;
      border-radius: 10px;
      font-weight: bold;
      line-height: 1.4;
    }

    .feedback.correct {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .feedback.wrong {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 25px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      cursor: pointer;
      background: #6366f1;
      color: white;
    }

    .btn:hover:not(:disabled) {
      opacity: 0.9;
    }

    .btn:disabled {
      background: #d1d5db;
      cursor: not-allowed;
    }

    .result {
      text-align: center;
      padding: 20px;
    }

    .result h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .result p {
      color: #6b7280;
      margin-bottom: 25px;
      font-size: 18px;
    }

    .loading,
    .error {
      text-align: center;
      padding: 40px 10px;
    }

    .error {
      color: #dc2626;
    }

    @media (max-width: 600px) {
      .quiz-card {
        padding: 20px;
      }

      .question {
        font-size: 18px;
      }

      .option {
        font-size: 15px;
      }

      .buttons {
        flex-direction: row;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Beyond the Imagination</h1>
    <p id="examTitle">Loading exam...</p>
  </div>

  <div class="container">
    <div class="quiz-card">

      <div id="loading" class="loading">
        Loading questions...
      </div>

      <div id="quiz" style="display:none;">

        <div class="progress" id="progress"></div>

        <div class="question" id="question"></div>

        <div id="options"></div>

        <div id="feedback" class="feedback"></div>

        <div class="buttons">
          <button class="btn" id="previousBtn" onclick="previousQuestion()">
            Previous
          </button>

          <button class="btn" id="nextBtn" onclick="nextQuestion()">
            Next
          </button>
        </div>

      </div>

      <div id="result" class="result" style="display:none;">
        <h2>Exam Completed</h2>
        <p id="score"></p>

        <button class="btn" onclick="restartQuiz()">
          Try Again
        </button>
      </div>

      <div id="error" class="error" style="display:none;"></div>

    </div>
  </div>

<script>

  let questions = [];
  let currentQuestion = 0;
  let answers = [];
  let answered = false;
  let scoreValue = 0;

  const urlParams = new URLSearchParams(window.location.search);
  const bank = urlParams.get("bank");


  async function loadQuiz() {

    if (!bank) {
      showError("No question bank was specified.");
      return;
    }

    try {

      const response = await fetch(bank);

      if (!response.ok) {
        throw new Error("Question bank not found.");
      }

      const data = await response.json();

      /*
        The JSON can be:

        {
          "questions": [
            {
              "question": "...",
              "options": ["A", "B", "C", "D"],
              "correctAnswer": "B"
            }
          ]
        }

        This matches the JSON exam files already created.
      */

      if (Array.isArray(data)) {
        questions = data;
      } else if (Array.isArray(data.questions)) {
        questions = data.questions;
      } else {
        throw new Error("Invalid JSON question format.");
      }

      if (questions.length === 0) {
        throw new Error("This exam has no questions.");
      }

      answers = new Array(questions.length).fill(null);

      document.getElementById("loading").style.display = "none";
      document.getElementById("quiz").style.display = "block";

      document.getElementById("examTitle").textContent =
        formatExamName(bank);

      showQuestion();

    } catch (error) {

      showError(
        "Could not load the exam. Check that the JSON file exists and the filename is correct."
      );

      console.error(error);
    }
  }


  function formatExamName(path) {

    let name = path.split("/").pop();

    name = name.replace(".json", "");
    name = name.replace(/-/g, " ");

    return name.replace(/\b\w/g, letter => letter.toUpperCase());
  }


  function showQuestion() {

    const question = questions[currentQuestion];

    answered = answers[currentQuestion] !== null;

    document.getElementById("progress").textContent =
      `Question ${currentQuestion + 1} of ${questions.length}`;

    document.getElementById("question").textContent =
      question.question;

    const optionsContainer =
      document.getElementById("options");

    optionsContainer.innerHTML = "";

    const feedback =
      document.getElementById("feedback");

    feedback.className = "feedback";
    feedback.textContent = "";

    question.options.forEach((option, index) => {

      const button = document.createElement("button");

      button.className = "option";

      button.textContent =
        `${String.fromCharCode(65 + index)}. ${getOptionText(option)}`;

      button.onclick = () => selectOption(index);

      if (answered) {
        button.disabled = true;

        const correctIndex =
          getCorrectAnswerIndex(question);

        if (index === correctIndex) {
          button.classList.add("correct");
        }

        if (
          answers[currentQuestion] === index &&
          index !== correctIndex
        ) {
          button.classList.add("wrong");
        }
      }

      optionsContainer.appendChild(button);
    });


    if (answered) {
      const correctIndex =
        getCorrectAnswerIndex(question);

      if (answers[currentQuestion] === correctIndex) {
        feedback.className = "feedback correct";
        feedback.textContent = "✓ Correct answer!";
      } else {
        feedback.className = "feedback wrong";
        feedback.textContent =
          `✗ Incorrect. The correct answer is ${String.fromCharCode(65 + correctIndex)}.`;
      }
    }


    document.getElementById("previousBtn").disabled =
      currentQuestion === 0;

    document.getElementById("nextBtn").textContent =
      currentQuestion === questions.length - 1
        ? "Finish"
        : "Next";
  }


  function getOptionText(option) {

    if (typeof option === "string") {
      return option;
    }

    if (option.text) {
      return option.text;
    }

    if (option.label) {
      return option.label;
    }

    if (option.value) {
      return option.value;
    }

    return "";
  }


  function getCorrectAnswerIndex(question) {

    let correctAnswer =
      question.correctAnswer;

    if (correctAnswer === undefined) {
      correctAnswer = question.answer;
    }

    if (correctAnswer === undefined) {
      correctAnswer = question.correct;
    }

    if (correctAnswer === undefined) {
      correctAnswer = question.correctIndex;
    }


    if (typeof correctAnswer === "number") {

      if (
        correctAnswer >= 0 &&
        correctAnswer < question.options.length
      ) {
        return correctAnswer;
      }

      if (
        correctAnswer >= 1 &&
        correctAnswer <= question.options.length
      ) {
        return correctAnswer - 1;
      }
    }


    if (typeof correctAnswer === "string") {

      const trimmed =
        correctAnswer.trim();

      const upper =
        trimmed.toUpperCase();

      if (/^[A-D]$/.test(upper)) {
        return upper.charCodeAt(0) - 65;
      }

      const numeric =
        Number(trimmed);

      if (
        Number.isInteger(numeric) &&
        numeric >= 1 &&
        numeric <= question.options.length
      ) {
        return numeric - 1;
      }

      for (let i = 0; i < question.options.length; i++) {

        if (
          getOptionText(question.options[i]) === trimmed
        ) {
          return i;
        }
      }
    }

    return -1;
  }


  function selectOption(index) {

    if (answered) {
      return;
    }

    const question =
      questions[currentQuestion];

    const correctIndex =
      getCorrectAnswerIndex(question);

    answers[currentQuestion] = index;
    answered = true;

    const options =
      document.querySelectorAll(".option");

    options.forEach((option, optionIndex) => {

      option.disabled = true;

      if (optionIndex === correctIndex) {
        option.classList.add("correct");
      }

      if (
        optionIndex === index &&
        optionIndex !== correctIndex
      ) {
        option.classList.add("wrong");
      }
    });


    const feedback =
      document.getElementById("feedback");

    if (index === correctIndex) {

      scoreValue++;

      feedback.className = "feedback correct";
      feedback.textContent = "✓ Correct answer!";

    } else {

      feedback.className = "feedback wrong";
      feedback.textContent =
        `✗ Incorrect. The correct answer is ${String.fromCharCode(65 + correctIndex)}.`;
    }
  }


  function nextQuestion() {

    if (!answered) {
      alert("Please choose an answer first.");
      return;
    }

    if (currentQuestion < questions.length - 1) {

      currentQuestion++;
      showQuestion();

    } else {

      finishQuiz();
    }
  }


  function previousQuestion() {

    if (currentQuestion > 0) {

      currentQuestion--;
      showQuestion();
    }
  }


  function finishQuiz() {

    document.getElementById("quiz").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("score").textContent =
      `Your score: ${scoreValue} / ${questions.length} (${Math.round((scoreValue / questions.length) * 100)}%)`;
  }


  function restartQuiz() {

    currentQuestion = 0;
    answers = new Array(questions.length).fill(null);
    answered = false;
    scoreValue = 0;

    document.getElementById("result").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    showQuestion();
  }


  function showError(message) {

    document.getElementById("loading").style.display = "none";
    document.getElementById("quiz").style.display = "none";
    document.getElementById("error").style.display = "block";

    document.getElementById("error").textContent = message;
  }


  loadQuiz();

</script>

</body>
</html>
